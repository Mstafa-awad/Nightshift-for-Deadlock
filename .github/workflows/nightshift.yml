name: Nightshift - Publish and Update

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 05:10 UTC on the first day of every month
    - cron: '10 5 1 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightshift-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout app and stored statistics
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh small per-hero snapshots (no raw match archives)
        id: refresh
        continue-on-error: true
        run: python scripts/update_data.py
      - name: Save successful data snapshots back to repository
        # Old snapshots are kept if API requests fail.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Nightshift match statistics'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare tiny static site
        run: |
          mkdir -p _site
          cp index.html app.js styles.css sw.js manifest.webmanifest _site/
          cp -R assets data _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Nightshift
        id: deployment
        uses: actions/deploy-pages@v4
